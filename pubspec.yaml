name: nutech_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  device_preview: ^1.1.0
  image_picker: ^1.1.2
  image_cropper: ^11.0.0 
  image_cropper_for_web: ^7.0.0 

  cupertino_icons: ^1.0.8
  table_calendar: ^3.2.0
  intl: ^0.20.2
  http: ^1.2.0
  
  csv: ^7.2.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Added for app icon generation
  flutter_launcher_icons: ^0.13.1

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/branding/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/branding/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/ui/headerdesign.png
    - assets/images/ui/bottombackground1.png
    - assets/images/ui/bottombackground2.png
    - assets/images/branding/nutechlogo1.png
    - assets/images/branding/nutechlogo2.png
    - assets/images/branding/app_icon.png # Added the new icon path
    - assets/images/avatar.png
    - assets/images/addimage.png
    - assets/images/offices/office1.jpg
    - assets/images/offices/office2.jpg
    - assets/images/offices/office3.jpg
    - assets/images/sites/site1.jpg
    - assets/images/sites/site2.jpg
    - assets/images/sites/site3.jpg
    - assets/admin/